# GAME-MANIA — gamemaniaauk.co.uk
# Apex is canonical. www always 301 → https://gamemaniaauk.co.uk
# Storefront + /admin on :3000; API under /api/ on :5000.
#
# Cert paths assume Certbot issued for both apex + www.

upstream frontend_upstream {
  server 127.0.0.1:3000;
}

upstream api_upstream {
  server 127.0.0.1:5000;
}

# Force www → apex (HTTP)
server {
  listen 80;
  listen [::]:80;
  server_name www.gamemaniaauk.co.uk;
  return 301 https://gamemaniaauk.co.uk$request_uri;
}

# Force www → apex (HTTPS)
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.gamemaniaauk.co.uk;

  ssl_certificate /etc/letsencrypt/live/gamemaniaauk.co.uk/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/gamemaniaauk.co.uk/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  return 301 https://gamemaniaauk.co.uk$request_uri;
}

# Apex HTTP → HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name gamemaniaauk.co.uk;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  return 301 https://gamemaniaauk.co.uk$request_uri;
}

# Apex HTTPS — main site
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name gamemaniaauk.co.uk;

  ssl_certificate /etc/letsencrypt/live/gamemaniaauk.co.uk/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/gamemaniaauk.co.uk/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  client_max_body_size 20m;

  location /api/ {
    limit_req zone=api_limit burst=30 nodelay;
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
