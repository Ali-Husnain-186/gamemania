# GAME-MANIA reverse proxy
# Replace certificate paths after Let's Encrypt init.

upstream frontend_upstream {
  server frontend:3000;
}

upstream admin_upstream {
  server admin:3001;
}

upstream api_upstream {
  server backend:4000;
}

server {
  listen 80;
  server_name gamemania.com www.gamemania.com admin.gamemania.com api.gamemania.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name gamemania.com www.gamemania.com;

  ssl_certificate /etc/letsencrypt/live/gamemania.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/gamemania.com/privkey.pem;

  location / {
    proxy_pass http://frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 443 ssl http2;
  server_name admin.gamemania.com;

  ssl_certificate /etc/letsencrypt/live/gamemania.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/gamemania.com/privkey.pem;

  location / {
    proxy_pass http://admin_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

server {
  listen 443 ssl http2;
  server_name api.gamemania.com;

  ssl_certificate /etc/letsencrypt/live/gamemania.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/gamemania.com/privkey.pem;

  client_max_body_size 20m;
  limit_req zone=api_limit burst=30 nodelay;

  location / {
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
