# GAME-MANIA reverse proxy — gamemania.tech
# Storefront + /admin on :3000; API under /api/ on :5000.
# Certbot will adjust SSL lines after first successful issue.

upstream frontend_upstream {
  server 127.0.0.1:3000;
}

upstream api_upstream {
  server 127.0.0.1:5000;
}

server {
  listen 80;
  server_name gamemania.tech www.gamemania.tech;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Temporary: serve site on HTTP until Certbot enables HTTPS redirect
  client_max_body_size 20m;

  location /api/ {
    limit_req zone=api_limit burst=30 nodelay;
    proxy_pass http://api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
